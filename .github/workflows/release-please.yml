name: Release Please

# Maintains a release PR that keeps CHANGELOG.md and version.txt in step with
# Conventional Commits on main. foodhub-android versions on its own line,
# independent of the other repos — see docs/development/VERSIONING.md in the docs
# repo. Merging the release PR tags the release and publishes a GitHub Release.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
