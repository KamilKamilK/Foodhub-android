name: Android Quality

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    android-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  # Verifies gradle-wrapper.jar against Gradle's published checksums.
                  validate-wrappers: true

            - name: Quality gate
              run: ./gradlew ktlintCheck detekt testDebugUnitTest assembleDebug --stacktrace

            - name: Upload test reports on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: '**/build/reports/'
                  retention-days: 7

    instrumented-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  validate-wrappers: true

            # ubuntu-latest runners don't ship a KVM-enabled udev rule by default;
            # without this the emulator falls back to unaccelerated (software) mode,
            # which is far too slow to boot in a CI job.
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            # API 35 matches compileSdk/targetSdk (gradle/libs.versions.toml) and the
            # emulator profile used for manual on-device verification. ubuntu-latest +
            # KVM is the current, well-supported pattern for this action — ~10x cheaper
            # per Actions minute than macos-latest, which this repo has no other reason
            # to use.
            - name: Run instrumented tests on a KVM-accelerated emulator
              uses: reactivecircus/android-emulator-runner@v2.38.0
              with:
                  api-level: 35
                  target: google_apis
                  arch: x86_64
                  profile: pixel_6
                  disable-animations: true
                  script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

            - name: Upload instrumented test reports on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: instrumented-test-reports
                  path: '**/build/reports/androidTests/'
                  retention-days: 7
