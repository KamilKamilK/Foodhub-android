name: Android Quality

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    android-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  # Verifies gradle-wrapper.jar against Gradle's published checksums.
                  validate-wrappers: true

            - name: Quality gate
              run: ./gradlew ktlintCheck detekt testDebugUnitTest assembleDebug --stacktrace

            - name: Upload test reports on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: '**/build/reports/'
                  retention-days: 7
