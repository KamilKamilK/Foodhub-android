org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# foodhub-api HTTP contract version this build targets, surfaced as
# BuildConfig.API_CONTRACT_VERSION in :core:network and sent on every request as
# the X-Api-Contract-Version header. Bump it when the app adopts a breaking API
# contract — independent of the app's versionName. See docs/development/VERSIONING.md.
foodhub.apiContractVersion=1
